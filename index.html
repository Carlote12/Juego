function step(){

for(let y=H-1;y>=0;y--)for(let k=0;k<W;k++){
const x=lr?k:W-1-k,i=y*W+x,t=T[i];if(!t)continue;c++;if(UP[i]===stamp)continue;const kd=K[t];

oc.putImageData(img,0,0);const w=cv.width,h=cv.height;cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=1;cx.globalCompositeOperation='source-over';cx.filter='none';cx.fillStyle='#0b0e13';cx.fillRect(0,0,w,h);cx.imageSmoothingEnabled=false;cx.drawImage(off,cam.x,cam.y,W*cam.s,H*cam.s);

function ln(a,b,r,tool){let x0=a[0],y0=a[1];const dx=Math.abs(b[0]-x0),dy=-Math.abs(b[1]-y0),sx=x0<b[0]?1:-1,sy=y0<b[1]?1:-1;let e=dx+dy;for(;;){stampAt(x0,y0,r,tool);if(x0===b[0]&&y0===b[1])break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
function commit(a,b){const r=Math.max(.5,S.brush/3);if(S.tool==='line')ln(a,b,r,'brush');else if(S.tool==='rect'){ln(a,[b[0],a[1]],r,'brush');ln([b[0],a[1]],b,r,'brush');ln(b,[a[0],b[1]],r,'brush');ln([a[0],b[1]],a,r,'brush')}else{const rad=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(16,rad*6|0);for(let q=0;q<n;q++){const an=q/n*6.2832;stampAt(Math.round(a[0]+Math.cos(an)*rad),Math.round(a[1]+Math.sin(an)*rad),r,'brush')}}}
const SH=['line','rect','circle'],gc=e=>{const r=cv.getBoundingClientRect();return[Math.floor((e.clientX-r.left-cam.x)/cam.s),Math.floor((e.clientY-r.top-cam.y)/cam.s)]};
const pts=new Map();let pinch=null,gp=null;
const act=()=>S.mode==='erase'?'eraser':S.tool;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
if(pts.size===2){S.down=false;start=null;const[a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};return}
S.down=true;S.mode=(e.button===1||e.shiftKey)?'pan':e.button===2?'erase':'paint';gp=cur=gc(e);
if(S.mode==='paint'&&SH.includes(S.tool))start=gp;else if(S.mode!=='pan')stampAt(gp[0],gp[1],S.brush,act())};
cv.onpointermove=e=>{const p=pts.get(e.pointerId);cur=gc(e);
if(p&&pinch&&pts.size>=2){p.x=e.clientX;p.y=e.clientY;const[a,b]=[...pts.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,r=cv.getBoundingClientRect();zoom(mx-r.left,my-r.top,d/pinch.d);cam.x+=mx-pinch.mx;cam.y+=my-pinch.my;pinch={d,mx,my};return}
if(p){if(S.down&&S.mode==='pan'){cam.x+=e.clientX-p.x;cam.y+=e.clientY-p.y}else if(S.down&&!start){ln(gp,cur,S.brush,act());gp=cur}p.x=e.clientX;p.y=e.clientY}};
cv.onpointerup=cv.onpointercancel=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(start&&S.down)commit(start,cur);S.down=false;start=null};
cv.oncontextmenu=e=>e.preventDefault();
cv.onwheel=e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoom(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.12:1/1.12)};
/* ===== UI ===== */
const $=id=>document.getElementById(id);
const TL=[['brush','Pincel'],['eraser','Borrador'],['line','Línea'],['rect','Rectángulo'],['circle','Círculo'],['heat','Calor'],['cold','Frío'],['spark','Chispa']];
TL.forEach(([id,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.t=id;b.onclick=()=>setTool(id);$('tools').appendChild(b)});
function setTool(t){S.tool=t;[...$('tools').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
const KN=['','polvo','líquido','gas','sólido','llama'];
function setMat(t){S.mat=t;if(t!==20)S.last=t;if(t===20)S.last=S.last||6;[...$('mats').querySelectorAll('button')].forEach(b=>b.classList.toggle('on',+b.dataset.m===t));
const d=D[t];$('mi').innerHTML='<b style="color:var(--c)">'+d[0]+'</b> · '+KN[d[2]]+' · dens. '+d[3]+' · k térm. '+d[5]+' · cond. '+d[6]+' · ignición '+(d[7]?d[7]+'°':'–')}
function buildMats(f){const el=$('mats');el.innerHTML='';[...new Set(D.map(d=>d[1]).filter(Boolean))].forEach(c=>{const ms=D.map((d,i)=>i).filter(i=>D[i][1]===c&&D[i][0].toLowerCase().includes(f));if(!ms.length)return;const h=document.createElement('h3');h.textContent=c;el.appendChild(h);ms.forEach(i=>{const b=document.createElement('button');b.className='m'+(i===S.mat?' on':'');b.style.cssText='width:100%;margin-bottom:3px';b.dataset.m=i;b.innerHTML='<i style="background:rgb('+D[i][4]+')"></i>'+D[i][0];b.onclick=()=>setMat(i);el.appendChild(b)})})}
$('q').oninput=e=>buildMats(e.target.value.toLowerCase());
const CFG=[['speed','Velocidad',.25,3,.25],['brush','Pincel',1,20,1],['grav','Gravedad',0,1.5,.1],['wind','Viento',-1,1,.1],['amb','Temp. ambiente °C',-20,60,1],['gen','Frecuencia generador',0,1,.05],['max','Máx. partículas',2000,40000,1000]];
const save=()=>{try{localStorage.setItem('sbp_prefs',JSON.stringify(S))}catch(e){}};
CFG.forEach(([k,l,mn,mx,st])=>{const lb=document.createElement('label');lb.innerHTML=l+' <b id="v_'+k+'"></b><input type="range" id="s_'+k+'" min="'+mn+'" max="'+mx+'" step="'+st+'">';$('set').appendChild(lb);const i=lb.querySelector('input');i.oninput=()=>{S[k]=+i.value;sync();save()}});
function sync(){CFG.forEach(([k])=>{$('s_'+k).value=S[k];$('v_'+k).textContent=S[k]});$('am').textContent=S.amb}
$('fpss').onchange=e=>{S.fps=+e.target.value;save()};$('glow').onchange=e=>{S.glow=e.target.checked;save()};
const VW=['Normal','Térmica','Conductividad'];VW.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>setView(i);$('vw').appendChild(b)});
function setView(v){S.view=v;[...$('vw').children].forEach((b,i)=>b.classList.toggle('on',i===v));$('lg').style.display=v===1?'flex':'none'}
function pause(p){S.paused=p===undefined?!S.paused:p;$('pb').textContent=S.paused?'▶ Reanudar':'⏸ Pausa'}
function reset(){T.fill(0);LF.fill(0);TP.fill(S.amb);rings.length=0}
$('pb').onclick=()=>pause();$('zi').onclick=()=>zoom(cv.width/2,cv.height/2,1.3);$('zo').onclick=()=>zoom(cv.width/2,cv.height/2,1/1.3);$('zr').onclick=fit;$('rs').onclick=reset;
/* ===== GUARDADO ===== */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function list(){const l=$('wl');l.innerHTML='';try{Object.keys(localStorage).filter(k=>k.startsWith('sbp_w_')).forEach(k=>{const o=document.createElement('option');o.textContent=k.slice(6);l.appendChild(o)})}catch(e){}}
$('sv').onclick=()=>{const n=$('wn').value.trim()||'mundo';const p=new Uint8Array(N);for(let i=0;i<N;i++)p[i]=cl((TP[i]+100)/6);try{localStorage.setItem('sbp_w_'+n,JSON.stringify({T:b64(T),L:b64(LF),P:b64(p)}));list()}catch(e){alert('No se pudo guardar (almacenamiento lleno o no disponible).')}};
$('ld').onclick=()=>{try{const o=JSON.parse(localStorage.getItem('sbp_w_'+$('wl').value));if(!o)return;T.set(ub(o.T));LF.set(ub(o.L));const p=ub(o.P);for(let i=0;i<N;i++)TP[i]=p[i]*6-100}catch(e){}};
$('dl').onclick=()=>{try{localStorage.removeItem('sbp_w_'+$('wl').value)}catch(e){}list()};
/* ===== TECLADO ===== */
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type==='text')return;const k=e.key;let h=true;
if(k===' ')pause();else if(k==='[')S.brush=Math.max(1,S.brush-1);else if(k===']')S.brush=Math.min(20,S.brush+1);else if(k==='t'||k==='T')setView(S.view===1?0:1);else if(k==='c'||k==='C')setView(S.view===2?0:2);
else if(k==='v'||k==='V')S.wind=S.wind<=0&&S.wind>-1?-1:S.wind===-1?0:S.wind===0?1:0;else if(k==='r'||k==='R')reset();else if(k==='Escape'){setTool('brush');start=null;S.down=false}else h=false;if(h){e.preventDefault();sync()}});
/* ===== BUCLE ===== */
let last=performance.now(),acc=0,fc=0,sc=0,lt=last,lr=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.1,(now-last)/1000);last=now;
if(!S.paused){acc+=dt*S.speed;let n=0;while(acc>=1/60&&n<5){step();acc-=1/60;n++;sc++}if(acc>.1)acc=0}
if(now-lr<1000/S.fps-2)return;lr=now;
if(S.down&&S.mode!=='pan'&&!start&&gp&&['brush','eraser','heat','cold','spark'].includes(act()))stampAt(cur[0],cur[1],S.brush,act());
render();fc++;if(now-lt>=500){const s=(now-lt)/1000;$('fps').textContent=Math.round(fc/s);$('tps').textContent=S.paused?0:Math.round(sc/s);$('pc').textContent=cnt;fc=sc=0;lt=now}}
try{Object.assign(S,JSON.parse(localStorage.getItem('sbp_prefs'))||{},{down:false,paused:false,mode:'paint',view:0})}catch(e){}
TP.fill(S.amb);$('fpss').value=S.fps;$('glow').checked=S.glow;buildMats('');setMat(S.mat);setTool(S.tool);setView(0);sync();list();fit();addEventListener('resize',fit);
// escena inicial de demostración
for(let x=40;x<216;x++)for(let y=140;y<160;y++)put(y*W+x,4);for(let x=60;x<70;x++)for(let y=100;y<140;y++)put(y*W+x,12);for(let x=120;x<160;x++)for(let y=125;y<140;y++)put(y*W+x,6);
requestAnimationFrame(frame);
</script></body></html>
